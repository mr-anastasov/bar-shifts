<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bar crew – Swing Buzz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#FBEEDF; --surface:#FFFFFF; --ink:#0B1433; --muted:#5F6680; --line:#EED6BE;
  --red:#E1341A; --red-ink:#B8260F; --teal:#2C7084; --soft:#F6DCC3; --hi:#0B1433; --hi-ink:#FBEEDF; --danger:#B3261E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1633; --surface:#18224A; --ink:#F8E8D6; --muted:#A7AEC8; --line:#2A3566;
    --red:#FF5A3C; --red-ink:#FF7A5F; --teal:#5FB3C9; --soft:#23305E; --hi:#E1341A; --hi-ink:#FFF4EA; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1633; --surface:#18224A; --ink:#F8E8D6; --muted:#A7AEC8; --line:#2A3566;
  --red:#FF5A3C; --red-ink:#FF7A5F; --teal:#5FB3C9; --soft:#23305E; --hi:#E1341A; --hi-ink:#FFF4EA; --danger:#FF8A80;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}
.disp{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif}

header{text-align:center}
.logo{display:block;margin:4px auto 0;width:min(78%,360px);height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:drop-shadow(0 0 1.5px #F8E8D6)}}
:root[data-theme="dark"] .logo{filter:drop-shadow(0 0 1.5px #F8E8D6)}
header p{margin:6px 0 0;color:var(--muted)}

.pages{display:flex;gap:4px;margin:16px 0 0;background:var(--soft);border-radius:14px;padding:4px}
.pg{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 4px;font-weight:600;font-size:15px}
.pg[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.now{margin:16px 0 0;background:var(--hi);color:var(--hi-ink);border-radius:14px;padding:14px 16px;text-align:center}
.now .when{font-weight:800;font-size:26px;line-height:1}
.now .who{margin-top:6px;font-size:15px}
.now .who span{font-weight:600}
.legend{margin:14px 0 0;font-size:14px;color:var(--muted);text-align:center}
.legend b{color:var(--ink);font-weight:600}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding:12px 0 10px;margin-top:6px}
.tab{flex:1;border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 6px;text-align:center}
.tab .d{display:block;font-weight:800;font-size:24px;line-height:1}
.tab .dt{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#FFF4EA}
.tab[aria-selected="true"] .dt{color:inherit;opacity:.85}

.pick{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:15px}
.pick button{border:0;background:transparent;font-weight:600;text-decoration:underline;padding:4px}

.slots{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.slot.past{opacity:.5}
.slot.live{border:2px solid var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 20%,transparent)}
.slot .time{font-weight:600;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.tag{font-family:"Work Sans",sans-serif;font-size:12px;font-weight:600;background:var(--red);color:#FFF4EA;border-radius:999px;padding:2px 8px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;text-align:center}
.role .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.name{display:inline-block;border:0;background:transparent;padding:2px 0;font-weight:600;border-radius:6px;word-break:break-word}
.name + .name::before{content:" / ";font-weight:400;color:var(--muted)}
.name.sel{background:var(--teal);color:#FFF;padding:2px 6px}
.role.floater .name{font-weight:500}
.empty{color:var(--muted)}
.note{background:var(--soft);border-color:transparent}
.note .text{margin-top:6px;font-weight:600;color:var(--red-ink);text-align:center}
.hint{margin:16px 0 0;font-size:13px;color:var(--muted);text-align:center}

.cards{display:grid;gap:12px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 10px;font-weight:800;font-size:32px;line-height:1;color:var(--red-ink)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;font-size:22px;line-height:1;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center}
.steps strong{color:var(--red-ink)}

.clhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.clhead h2{margin:0}
.prog{font-size:14px;color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:0 0 10px}
.bar i{display:block;height:100%;background:var(--teal)}
.checks{list-style:none;margin:0;padding:0}
.checks li + li{border-top:1px solid var(--line)}
.checks label{display:flex;gap:12px;align-items:center;padding:12px 2px;cursor:pointer}
.checks input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center;margin:0;background:transparent}
.checks input:checked{background:var(--teal);border-color:var(--teal)}
.checks input:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.reset{margin-top:10px;border:2px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;font-weight:600;width:100%}

.editbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.editbar .in{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.editbar .msg{flex:1 1 200px;font-size:14px}
.editbar button{border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn-save{background:var(--red);color:#FFF4EA}
.btn-cancel{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0}
.field.t{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:600;font-size:22px;text-align:center}
textarea.field{min-height:150px;resize:vertical;line-height:1.5}
.erow{display:flex;gap:8px;align-items:center}
.del{border:0;background:transparent;color:var(--danger);font-weight:600;padding:8px;white-space:nowrap}
.adds{display:flex;gap:8px;margin-top:10px}
.add{flex:1;border:2px dashed var(--line);background:transparent;border-radius:12px;padding:12px;font-weight:600}
.ehelp{font-size:13px;color:var(--muted);margin:6px 0 0}
.editing .pages{outline:2px dashed var(--red);outline-offset:3px}

@media (max-width:380px){.roles{gap:6px}.slot{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script id="app-script">
(function(){

  var HEAD = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Bar crew – Swing Buzz</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">';

  var PAGES = [["shifts","Shifts"],["cocktails","Cocktails"],["checklists","Checklists"]];

  state.sops = state.sops || []; state.checklists = state.checklists || [];
  var app = document.getElementById("app");
  var draft = null, editing = false, readOnly = false, selName = null, msg = "", saving = false, artifactNS = null;
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  var page = lsGet("bs-page") || "shifts";
  var tab = lsGet("barshifts-tab");
  var ticks = {}; try { ticks = JSON.parse(lsGet("bs-ticks") || "{}") || {}; } catch(e){ ticks = {}; }

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function(a){ artifactNS = a; }, function(){});
  }

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
  function names(v){ return String(v||"").split("/").map(function(x){return x.trim();}).filter(Boolean); }
  function key(n){ return n.trim().toLowerCase(); }
  function lines(t){ return String(t||"").split("\n").map(function(x){ return x.replace(/^\s*(\d+[.)]|[-*]\s*\[[ xX]?\]|[-*])\s*/, "").trim(); }).filter(Boolean); }

  function range(day, time){
    var m = String(time).match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/);
    if (!m) return null;
    var p = day.date.split("-").map(Number);
    function at(h, mi){ var d = new Date(p[0], p[1]-1, p[2], h, mi); if (h < 12) d.setDate(d.getDate()+1); return d; }
    var s = at(+m[1], +m[2]), e = at(+m[3], +m[4]);
    if (e <= s) e = new Date(e.getTime() + 864e5);
    return {s:s, e:e};
  }
  function fmtDate(iso){ var p = iso.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
  function pickTab(){
    if (tab && state.days.some(function(d){return d.id===tab;})) return tab;
    var now = new Date();
    for (var i=0;i<state.days.length;i++){ var d = state.days[i];
      for (var j=0;j<d.slots.length;j++){ var r = range(d, d.slots[j].time); if (r && now < r.e) return d.id; } }
    return state.days[0] && state.days[0].id;
  }
  function liveNow(){
    var now = new Date();
    for (var i=0;i<state.days.length;i++){ var d = state.days[i];
      for (var j=0;j<d.slots.length;j++){ var r = range(d, d.slots[j].time); if (r && now >= r.s && now < r.e) return {day:d, slot:d.slots[j]}; } }
    return null;
  }
  function summary(n){
    var k = key(n), count = 0, mins = 0;
    state.days.forEach(function(d){ d.slots.forEach(function(s){
      if (s.note != null) return;
      var hit = ROLES.some(function(r){ return names(s[r[0]]).some(function(x){ return key(x)===k; }); });
      if (hit){ count++; var r = range(d, s.time); if (r) mins += (r.e - r.s)/6e4; }
    }); });
    var h = Math.floor(mins/60), m = Math.round(mins%60);
    return count + (count===1?" shift, ":" shifts, ") + h + " h" + (m ? " " + m + " min" : "") + " across the weekend";
  }
  function nameBtns(v){

    if (!ns.length) return '<span class="empty">—</span>';

  function shiftsView(src){

    var live = !editing && liveNow();
    if (live){
      h += '<section class="now" aria-live="polite"><div class="when disp">On the bar now, '+esc(live.slot.time)+'</div><div class="who">'+
        (live.slot.note != null ? esc(live.slot.note) : ROLES.filter(function(r){return names(live.slot[r[0]]).length;}).map(function(r){ return r[1]+': <span>'+esc(live.slot[r[0]])+'</span>'; }).join(", "))+'</div></section>';
    }
    h += '<p class="legend"><b>Main</b> stays longest. <b>Rotating</b> swaps in. <b>Floater</b> jumps in when a line forms.</p>';
    h += '<nav class="tabs" role="tablist" aria-label="Night">'+src.days.map(function(d){
      return '<button type="button" role="tab" class="tab" data-tab="'+d.id+'" aria-selected="'+(d.id===tab)+'"><span class="d disp">'+esc(d.label)+'</span><span class="dt">'+fmtDate(d.date)+'</span></button>';
    }).join("")+'</nav>';
    if (!editing && selName) h += '<div class="pick" role="status"><span><b>'+esc(selName)+'</b>: '+esc(summary(selName))+'</span><button type="button" data-clear>Clear</button></div>';
    if (editing){
      h += '<ol class="slots">'+day.slots.map(function(s, i){
        var head = '<div class="erow"><input class="field t" aria-label="Time" data-f="slot" data-d="'+di+'" data-i="'+i+'" data-k="time" value="'+esc(s.time)+'"><button type="button" class="del" data-del="slot:'+di+':'+i+'">Delete</button></div>';
        if (s.note != null) return '<li class="slot note">'+head+'<div style="margin-top:8px"><input class="field" aria-label="Note" data-f="slot" data-d="'+di+'" data-i="'+i+'" data-k="note" value="'+esc(s.note)+'"></div></li>';
        return '<li class="slot">'+head+'<div class="roles">'+ROLES.map(function(r){
          return '<label class="role"><span class="lbl">'+r[1]+'</span><input class="field" style="text-align:center" data-f="slot" data-d="'+di+'" data-i="'+i+'" data-k="'+r[0]+'" value="'+esc(s[r[0]]||"")+'"></label>';
        }).join("")+'</div></li>';
      }).join("")+'</ol>';
      h += '<div class="adds"><button type="button" class="add" data-add="slot:'+di+'">Add slot</button><button type="button" class="add" data-add="note:'+di+'">Add note</button></div>';
    } else {
      var now = new Date();
      h += '<ol class="slots">'+day.slots.map(function(s){
        var r = range(day, s.time), cls = "slot", tag = "";
        if (r && now >= r.e) cls += " past";
        if (r && now >= r.s && now < r.e){ cls += " live"; tag = '<span class="tag">Now</span>'; }
        if (s.note != null) return '<li class="'+cls+' note"><div class="time disp">'+esc(s.time)+tag+'</div><div class="text">'+esc(s.note)+'</div></li>';
        return '<li class="'+cls+'"><div class="time disp">'+esc(s.time)+tag+'</div><div class="roles">'+
          ROLES.map(function(r2){ return '<div class="role '+r2[0]+'"><span class="lbl">'+r2[1]+'</span>'+nameBtns(s[r2[0]])+'</div>'; }).join("")+'</div></li>';
      }).join("")+'</ol>';
      h += '<p class="hint">Tap a name to see all of that person\u2019s shifts.</p>';
    }
    return h;
  }

  /* ---------- cocktails ---------- */
  function cocktailsView(src){
    if (editing){
      return '<div class="cards">'+src.sops.map(function(c, i){
        return '<section class="card"><div class="erow"><input class="field t" style="text-align:left" aria-label="Cocktail name" data-f="sop" data-i="'+i+'" data-k="title" value="'+esc(c.title)+'"><button type="button" class="del" data-del="sop:'+i+'">Delete</button></div>'+
          '<textarea class="field" style="margin-top:8px" aria-label="Steps" data-f="sop" data-i="'+i+'" data-k="steps">'+esc(c.steps.join("\n"))+'</textarea></section>';
      }).join("")+'</div><p class="ehelp">One step per line. Wrap words in **double stars** to make them bold.</p><div class="adds"><button type="button" class="add" data-add="sop">Add cocktail</button></div>';
    }
    if (!src.sops.length) return '<p class="hint">No recipes yet.</p>';
    return '<div class="cards">'+src.sops.map(function(c){
      return '<section class="card"><h2 class="disp">'+esc(c.title)+'</h2><ol class="steps">'+c.steps.map(function(s){ return '<li><span>'+md(s)+'</span></li>'; }).join("")+'</ol></section>';
    }).join("")+'</div>';
  }

  /* ---------- checklists ---------- */
  function tk(list, item){ return key(list.title) + "|" + key(item); }
  function checklistsView(src){
    if (editing){
      return '<div class="cards">'+src.checklists.map(function(c, i){
        return '<section class="card"><div class="erow"><input class="field t" style="text-align:left" aria-label="Checklist name" data-f="cl" data-i="'+i+'" data-k="title" value="'+esc(c.title)+'"><button type="button" class="del" data-del="cl:'+i+'">Delete</button></div>'+
          '<textarea class="field" style="margin-top:8px;min-height:260px" aria-label="Items" data-f="cl" data-i="'+i+'" data-k="items">'+esc(c.items.join("\n"))+'</textarea></section>';
      }).join("")+'</div><p class="ehelp">One item per line.</p><div class="adds"><button type="button" class="add" data-add="cl">Add checklist</button></div>';
    }
    return '<div class="cards">'+src.checklists.map(function(c, i){
      var done = c.items.filter(function(it){ return ticks[tk(c, it)]; }).length, pct = c.items.length ? Math.round(done*100/c.items.length) : 0;
      return '<section class="card"><div class="clhead"><h2 class="disp">'+esc(c.title)+'</h2><span class="prog">'+done+' of '+c.items.length+' done</span></div>'+
        '<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
        '<ul class="checks">'+c.items.map(function(it){ var on = !!ticks[tk(c, it)];
          return '<li><label><input type="checkbox" data-tick="'+esc(tk(c, it))+'"'+(on?' checked':'')+'><span>'+md(it)+'</span></label></li>'; }).join("")+'</ul>'+
        '<button type="button" class="reset" data-reset="'+i+'">Untick all for next shift</button></section>';
    }).join("")+'</div><p class="hint">Ticks stay on this phone only, so each bartender keeps their own.</p>';
  }

  function render(){
    var src = editing ? draft : state;
    var h = '<header><img class="logo" id="logo-img" src="'+LOGO+'" alt="Swing Buzz festival" draggable="false"><p>'+esc(src.subtitle)+'</p></header>';
    h += '<nav class="pages" role="tablist" aria-label="Section">'+PAGES.map(function(p){ return '<button type="button" role="tab" class="pg" data-page="'+p[0]+'" aria-selected="'+(p[0]===page)+'">'+p[1]+'</button>'; }).join("")+'</nav>';
    h += page === "cocktails" ? cocktailsView(src) : page === "checklists" ? checklistsView(src) : shiftsView(src);
    if (editing) h += '<div class="editbar" role="region" aria-label="Editing"><div class="in"><span class="msg">'+esc(msg || "Editing. Saved changes show for everyone who opens this page.")+'</span><button type="button" class="btn-cancel" data-cancel>Cancel</button><button type="button" class="btn-save" data-save'+(saving?' disabled':'')+'>'+(saving?'Saving…':'Save changes')+'</button></div></div>';
    document.body.classList.toggle("editing", editing);
    app.innerHTML = h;
  }

  function flash(t){ var el = document.createElement("div"); el.textContent = t; el.setAttribute("role","status");
    el.style.cssText = "position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:20;max-width:688px;margin:0 auto";
    document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 3500); }
  function enterEdit(){
    if (readOnly){ flash("This page is view-only for you. Only the organiser can save changes."); return; }
    draft = JSON.parse(JSON.stringify(state)); editing = true; msg = ""; selName = null; render();
  }
  function clean(s){
    s.days.forEach(function(d){ d.slots.forEach(function(x){ Object.keys(x).forEach(function(k){ if (typeof x[k]==="string") x[k]=x[k].trim(); }); }); });
    s.sops = s.sops.filter(function(c){ return c.title.trim() || c.steps.length; });
    s.checklists = s.checklists.filter(function(c){ return c.title.trim() || c.items.length; });
    return s;
  }
  function buildDoc(s){
    var json = JSON.stringify(s).replace(/</g, "\\u003c");
    var css = document.getElementById("app-style").textContent;
    var js = document.getElementById("app-script").textContent;
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n" + HEAD + "\n<style id=\"app-style\">" + css + "</style>\n</head>\n<body>\n<div class=\"wrap\" id=\"app\"></div>\n" +
      "<script type=\"text/plain\" id=\"logo\">" + LOGO + "<\/script>\n" +
      "<script type=\"application/json\" id=\"data\">" + json + "<\/script>\n<script id=\"app-script\">" + js + "<\/script>\n</body>\n</html>\n";
  }
  function save(retried){
    if (!artifactNS){ msg = "Saving isn\u2019t available in this view. Open the page inside Claude to save for everyone."; render(); return; }
    saving = true; msg = "Saving…"; render();
    try { sessionStorage.setItem("bs-page", page); } catch(e){}
    artifactNS.publish(buildDoc(clean(draft))).then(function(){
      saving = false; msg = "Saved. Loading the new version…"; render();
    }, function(e){
      saving = false; var c = e && e.code;
      if (c === "conflict") msg = "Someone else saved first. Loading their version now.";
      else if (["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].indexOf(c) > -1){
        readOnly = true; editing = false; draft = null; render(); flash("This page is view-only for you. Only the organiser can save changes."); return;
      }
      else if (c === "rate_limited") msg = "Too many saves in a row. Wait a minute, then save again.";
      else if (c === "upstream_error" && !retried){ msg = "Connection hiccup. Trying again…"; render(); setTimeout(function(){ save(true); }, 1200 + Math.random()*1200); return; }
      else msg = "Couldn\u2019t save (" + (c || "unknown error") + "). Your edits are still here.";
      render();
    });
  }

  var taps = 0, last = 0;
  app.addEventListener("click", function(ev){
    var t = ev.target, b;
    if (t.closest("#logo-img")){
      var now = Date.now(); taps = (now - last < 550) ? taps + 1 : 1; last = now;
      if (taps >= 3 && !editing){ taps = 0; enterEdit(); }
      return;
    }
    if ((b = t.closest("[data-page]"))){ page = b.getAttribute("data-page"); lsSet("bs-page", page); render(); window.scrollTo(0,0); return; }
    if ((b = t.closest("[data-tab]"))){ tab = b.getAttribute("data-tab"); lsSet("barshifts-tab", tab); render(); return; }
    if ((b = t.closest("[data-name]"))){ var n = b.getAttribute("data-name"); selName = (selName && key(selName)===key(n)) ? null : n; render(); return; }
    if (t.closest("[data-clear]")){ selName = null; render(); return; }
    if ((b = t.closest("[data-reset]"))){ var c = state.checklists[+b.getAttribute("data-reset")]; c.items.forEach(function(it){ delete ticks[tk(c,it)]; }); lsSet("bs-ticks", JSON.stringify(ticks)); render(); return; }
    if (!editing) return;
    if (t.closest("[data-cancel]")){ editing = false; draft = null; msg = ""; render(); return; }
    if (t.closest("[data-save]")){ if (!saving) save(false); return; }
    if ((b = t.closest("[data-del]"))){
      var p = b.getAttribute("data-del").split(":");
      if (p[0] === "slot") draft.days[+p[1]].slots.splice(+p[2],1);
      else if (p[0] === "sop") draft.sops.splice(+p[1],1);
      else if (p[0] === "cl") draft.checklists.splice(+p[1],1);
      render(); return;
    }
    if ((b = t.closest("[data-add]"))){
      var a = b.getAttribute("data-add").split(":");
      if (a[0] === "slot") draft.days[+a[1]].slots.push({time:"00:00 - 00:00",main:"",rotating:"",floater:""});
      else if (a[0] === "note") draft.days[+a[1]].slots.push({time:"00:00 - 00:00",note:""});
      else if (a[0] === "sop") draft.sops.push({title:"New cocktail",steps:[]});
      else if (a[0] === "cl") draft.checklists.push({title:"New checklist",items:[]});
      render(); return;
    }
  });
  app.addEventListener("change", function(ev){
    var t = ev.target;
    if (t.matches("[data-tick]")){ var k = t.getAttribute("data-tick"); if (t.checked) ticks[k] = 1; else delete ticks[k]; lsSet("bs-ticks", JSON.stringify(ticks)); render(); }
  });
  app.addEventListener("input", function(ev){
    var t = ev.target; if (!editing || !t.matches("[data-f]")) return;
    var f = t.getAttribute("data-f"), i = +t.getAttribute("data-i"), k = t.getAttribute("data-k");
    if (f === "slot") draft.days[+t.getAttribute("data-d")].slots[i][k] = t.value;
    else if (f === "sop") draft.sops[i][k] = k === "steps" ? lines(t.value) : t.value;
    else if (f === "cl") draft.checklists[i][k] = k === "items" ? lines(t.value) : t.value;
  });

  try { var sp = sessionStorage.getItem("bs-page"); if (sp){ page = sp; sessionStorage.removeItem("bs-page"); } } catch(e){}
  if (!PAGES.some(function(p){ return p[0]===page; })) page = "shifts";
  render();
  setInterval(function(){ if (!editing && page === "shifts") render(); }, 60000);
})();
</script>
</body>
</html>
